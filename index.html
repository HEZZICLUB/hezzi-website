<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEZZI | Launching Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFCC00',
                            dark: '#0A0A0C',
                            card: '#141418',
                            border: '#26262E',
                            muted: '#A1A1AA'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-white font-sans antialiased min-h-screen flex flex-col justify-between p-6">

    <div class="max-w-5xl mx-auto w-full pt-12 text-center flex-1 flex flex-col justify-center items-center">
        
        <!-- HEZZI Logo Image -->
        <img src="HEZZI_LOGO_2023.png" alt="HEZZI Logo" class="h-16 sm:h-20 w-auto object-contain mb-8">

        <!-- Pill Badge -->
        <div class="inline-flex items-center px-4 py-1.5 rounded-full bg-brand-card border border-brand-border text-brand-yellow text-xs font-bold uppercase tracking-widest mb-6">
            NON-PROFIT | WELLNESS THROUGH SPORTS
        </div>

        <!-- Headline in single line across screens -->
        <h1 class="text-2xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight font-heading uppercase mb-4 whitespace-nowrap">
            New Platform <span class="text-brand-yellow">Launching Soon</span>
        </h1>
        
        <p class="text-brand-muted max-w-lg text-base sm:text-lg mb-8 leading-relaxed">
            We are building a new digital home for the HEZZI community, featuring our full tournament archives, wellness tracking portal, and event registrations.
        </p>

        <!-- Waitlist Form -->
        <form onsubmit="event.preventDefault(); alert('Thank you! We will notify you as soon as hezziclub.com is live.');" class="w-full max-w-md flex flex-col sm:flex-row gap-3">
            <input type="email" required placeholder="Enter your email for launch updates" class="bg-brand-card border border-brand-border rounded-lg px-4 py-3 text-sm w-full focus:outline-none focus:border-brand-yellow text-white">
            <button type="submit" class="bg-brand-yellow text-black font-bold px-6 py-3 rounded-lg text-xs uppercase tracking-wider whitespace-nowrap hover:bg-yellow-400 transition-all">Get Notified</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-brand-muted py-6 border-t border-brand-border/50 max-w-4xl mx-auto w-full uppercase">
        © 2026 HEZZI CLUB NON-PROFIT. ALL RIGHTS RESERVED. • <a href="mailto:info@hezziclub.com" class="hover:text-brand-yellow underline lowercase">info@hezziclub.com</a>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
